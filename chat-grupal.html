<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexo - Chat grupal</title>
  <link rel="stylesheet" href="chat-grupal.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mobile.css" />
  <script src="design-ui.js" defer></script>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <div class="topbar">
      <div class="logo">Nexo</div>
      <div class="av">AT</div>
    </div>

    <div class="layout">
      <nav class="sidebar">
        <a class="item" href="home.html">
          <span class="icon">?</span> Inicio
        </a>
        <a class="item active" href="chat-grupal.html">
          <span class="icon">?</span> Chats
        </a>
        <a class="item" href="videollamada.html">
          <span class="icon">?</span> Videollamada
        </a>
        <a class="item" href="tareas.html">
          <span class="icon">?</span> Tareas
        </a>
        <a class="item" href="perfil.html">
          <span class="icon">?</span> Perfil
        </a>
        <div class="spacer"></div>
        <a class="item" href="index.html">
          <span class="icon">?</span> Cerrar sesion
        </a>
      </nav>

      <aside class="chats">
        <h3>Chats</h3>
        <nav class="chat-switch" aria-label="Tipo de chat">
          <a href="chat-privado.html">Privados</a>
          <a href="chat-grupal.html" aria-current="page">Grupales</a>
        </nav>
        <div class="group-label">Grupos</div>
        <button type="button" class="chat-item active group-entry" id="legacy-group" aria-current="true">
          <span class="av">DW</span>
          <span><b>Desarrollo Web</b><small>Chat compartido</small></span>
        </button>
        <div id="my-groups"></div>
        <details class="group-create">
          <summary>Crear grupo</summary>
          <form id="create-group">
            <label>Nombre <input name="nombre" maxlength="60" required /></label>
            <fieldset>
              <legend>Elige al menos dos personas</legend>
              <div id="group-people">Cargando cuentas...</div>
            </fieldset>
            <button type="submit" disabled>Crear</button>
            <p id="create-group-status" role="status"></p>
          </form>
        </details>
      </aside>

      <main class="main">
        <div class="chat-head">
          <div class="av" id="active-group-avatar">DW</div>
          <div>
            <b id="active-group-name">Desarrollo Web</b><br />
            <small id="active-group-members">Chat grupal compartido</small>
          </div>
          <label class="encryption-control" for="group-encryption">
            <input id="group-encryption" type="checkbox" />
            Cifrado
          </label>
        </div>

        <div class="msgs" id="group-messages" aria-live="polite">
          <p class="chat-status" id="group-status">Cargando mensajes...</p>
        </div>

        <form class="inputbar" id="group-message-form">
          <button class="attach-button" id="group-attach-button" type="button">Adjuntar</button>
          <input class="file-input" id="group-file-input" type="file" accept="image/*,.txt,text/plain" hidden />
          <input id="group-message-input" placeholder="Escribe un mensaje..." maxlength="500" autocomplete="off" required />
          <button class="send" type="submit" aria-label="Enviar mensaje">?</button>
        </form>
      </main>
    </div>
  </div>
  <script type="module" src="chat-grupal.js"></script>
  <script type="module" src="auth-session.js"></script>
</body>
</html>
