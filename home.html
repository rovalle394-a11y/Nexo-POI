<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexo - Home</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>

    <div class="topbar">
      <div class="logo">Nexo</div>
      <input class="search" placeholder="Buscar publicaciones, personas..." />
      <div class="top-right">
        <span class="icon round">?</span>
        <div class="avatar">AT</div>
      </div>
    </div>

    <div class="layout">
      <nav class="sidebar">
        <a class="item active" href="home.html">
          <span class="icon">?</span> Inicio
        </a>
        <a class="item" href="chat-grupal.html">
          <span class="icon">?</span> Chats
        </a>
        <a class="item" href="videollamada.html">
          <span class="icon">?</span> Videollamada
        </a>
        <a class="item" href="tareas.html">
          <span class="icon">?</span> Tareas
        </a>
        <a class="item" href="perfil.html">
          <span class="icon">?</span> Perfil
        </a>
        <div class="spacer"></div>
        <a class="item" href="index.html">
          <span class="icon">?</span> Cerrar sesion
        </a>
      </nav>

      <main class="feed">
        <div class="composer">
          <span class="mini-avatar">AT</span>
          <input placeholder="Que estas pensando?" />
          <span class="icon">?</span>
          <span class="icon">?</span>
        </div>

        <div class="post">
          <div class="post-head">
            <div class="mini-avatar">AT</div>
            <div>
              <b>Ana Torres</b>
              <small>Hace 2 horas</small>
            </div>
            <span class="menu">...</span>
          </div>
          <p>Un buen dia para seguir aprendiendo</p>
          <div class="post-img">?</div>
          <div class="actions">
            <span><span class="icon">?</span> Me gusta</span>
            <span><span class="icon">?</span> Comentar</span>
          </div>
        </div>

        <div class="post">
          <div class="post-head">
            <div class="mini-avatar">LG</div>
            <div>
              <b>Luis Garcia</b>
              <small>Hace 4 horas</small>
            </div>
            <span class="menu">...</span>
          </div>
          <p>Disciplina hoy, resultados manana.</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
