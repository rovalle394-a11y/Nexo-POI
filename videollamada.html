<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexo - Videollamada</title>
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="videollamada.css" />
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>

    <div class="topbar">
      <div class="logo">Nexo</div>
      <div class="top-right"><div class="avatar">AT</div></div>
    </div>

    <div class="layout">
      <nav class="sidebar">
        <a class="item" href="home.html"><span class="icon">?</span> Inicio</a>
        <a class="item" href="chat-grupal.html"><span class="icon">?</span> Chats</a>
        <a class="item active" href="videollamada.html"><span class="icon">?</span> Videollamada</a>
        <a class="item" href="tareas.html"><span class="icon">?</span> Tareas</a>
        <a class="item" href="perfil.html"><span class="icon">?</span> Perfil</a>
        <div class="spacer"></div>
        <a class="item" href="index.html"><span class="icon">?</span> Cerrar sesion</a>
      </nav>

      <main class="video-area">
        <div class="call-setup">
          <label for="call-user" hidden>Participante</label>
          <select id="call-user" hidden>
            <option value="Ana Torres">Ana Torres</option>
            <option value="Luis Garcia">Luis Garcia</option>
          </select>
          <button id="start-call" type="button" hidden>Videollamar</button>
          <button id="join-call" type="button" hidden>Aceptar llamada</button>
          <a href="chat-privado.html">Volver al chat</a>
          <span id="call-status" role="status">Preparando videollamada...</span>
        </div>
        <div class="main-video">
          <video id="remote-video" autoplay playsinline></video>
          <div class="video-empty" id="remote-empty">Esperando al otro participante...</div>
          <span class="person-name" id="remote-name">Participante remoto</span>
          <div class="self-video">
            <video id="local-video" autoplay playsinline muted></video>
            <span id="local-name">Tu</span>
          </div>
        </div>
        <div class="call-controls">
          <button id="toggle-microphone" type="button" title="Silenciar microfono" disabled>Mic</button>
          <button id="toggle-camera" type="button" title="Desactivar camara" disabled>Cam</button>
          <button id="end-call" class="end-call" type="button" title="Finalizar llamada" disabled>Fin</button>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="videollamada.js"></script>
  <script type="module" src="auth-session.js"></script>
</body>
</html>
