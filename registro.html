<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexo - Registro</title>
  <link rel="stylesheet" href="registro.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mobile.css" />
  <script src="design-ui.js" defer></script>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <div class="card">
      <div class="left">
        <div class="logo">
          <h1>Nexo</h1>
          <p>CREA TU CUENTA</p>
        </div>
        <form id="registerForm">
          <label>Nombre completo</label>
          <input id="full-name" placeholder="Tu nombre" maxlength="80" autocomplete="name" required />

          <label>Correo electronico</label>
          <input id="email" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required />

          <label>Contrasena</label>
          <input id="password" type="password" minlength="6" placeholder="Minimo 6 caracteres" autocomplete="new-password" required />

          <label>Confirmar contrasena</label>
          <input id="confirm-password" type="password" minlength="6" placeholder="Repite tu contrasena" autocomplete="new-password" required />

          <button class="btn" type="submit">Registrarme</button>
        </form>
        <div class="footer">
          Ya tienes cuenta? <a href="index.html">Iniciar sesion</a>
        </div>
      </div>
      <div class="right">
        <div class="right-text">
          Mas<br />
          que una red,<br />
          una comunidad.
          <div class="right-line"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="auth-form.js"></script>
</body>
</html>
