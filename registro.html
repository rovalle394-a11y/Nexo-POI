<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexo - Registro</title>
  <link rel="stylesheet" href="registro.css" />
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <div class="card">
      <div class="left">
        <div class="logo">
          <h1>Nexo</h1>
          <p>CREA TU CUENTA</p>
        </div>
        <form action="home.html">
          <label>Nombre completo</label>
          <input placeholder="Tu nombre" required />

          <label>Nombre de usuario</label>
          <input placeholder="usuario" required />

          <label>Correo electronico</label>
          <input type="email" placeholder="tucorreo@ejemplo.com" required />

          <label>Contrasena</label>
          <input type="password" placeholder="Minimo 6 caracteres" required />

          <label>Confirmar contrasena</label>
          <input type="password" placeholder="Repite tu contrasena" required />

          <button class="btn" type="submit">Registrarme</button>
        </form>
        <div class="footer">
          Ya tienes cuenta? <a href="index.html">Iniciar sesion</a>
        </div>
      </div>
      <div class="right">
        <div class="right-text">
          Mas<br />
          que una red,<br />
          una comunidad.
          <div class="right-line"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
