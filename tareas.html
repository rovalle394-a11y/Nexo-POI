<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexo - Tareas</title>
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="tareas.css" />
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>

    <div class="topbar">
      <div class="logo">Nexo</div>
      <div class="top-right"><div class="avatar">AT</div></div>
    </div>

    <div class="layout">
      <nav class="sidebar">
        <a class="item" href="home.html"><span class="icon">?</span> Inicio</a>
        <a class="item" href="chat-grupal.html"><span class="icon">?</span> Chats</a>
        <a class="item" href="videollamada.html"><span class="icon">?</span> Videollamada</a>
        <a class="item active" href="tareas.html"><span class="icon">?</span> Tareas</a>
        <a class="item" href="perfil.html"><span class="icon">?</span> Perfil</a>
        <div class="spacer"></div>
        <a class="item" href="index.html"><span class="icon">?</span> Cerrar sesion</a>
      </nav>

      <main class="tasks-area">
        <div class="tasks-head">
          <div>
            <h1>Tareas</h1>
            <p>Grupo Desarrollo Web</p>
          </div>
          <div class="task-actions">
            <label for="task-current-user">
              Usuario
              <select id="task-current-user">
                <option value="Ana Torres">Ana Torres</option>
                <option value="Mariana Lopez">Mariana Lopez</option>
                <option value="Diego Martinez">Diego Martinez</option>
              </select>
            </label>
            <button id="new-task-button" type="button">＋ Nueva tarea</button>
          </div>
        </div>

        <form class="task-form" id="task-form" hidden>
          <label for="task-title">
            Nombre de la tarea
            <input id="task-title" maxlength="80" required />
          </label>
          <label for="task-date">
            Fecha limite
            <input id="task-date" type="date" />
          </label>
          <div class="form-actions">
            <button type="submit">Guardar tarea</button>
            <button id="cancel-task-button" type="button">Cancelar</button>
          </div>
        </form>

        <div class="daily-limit">
          <div>
            <b>Limite diario</b>
            <span id="daily-count">0 de 5 tareas validas hoy</span>
          </div>
          <div class="daily-progress"><span id="daily-progress"></span></div>
          <small>Solo cinco tareas completadas por dia cuentan para obtener medallas.</small>
        </div>
        <div class="tabs">
          <button class="active" type="button" data-filter="all">Todas</button>
          <button type="button" data-filter="pending">Pendientes</button>
          <button type="button" data-filter="completed">Completadas</button>
        </div>

        <div id="tasks-list">
          <p class="tasks-status" id="tasks-status">Cargando tareas...</p>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="tareas.js"></script>
</body>
</html>
